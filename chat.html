<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>
</head>
<body>

<form action = #>
		<input type="text">
		<button>Envoyer !</button>
	</form>
	
	<div class="messages">
		<ul>
		</ul>
	</div>
	

	<script>
		fetch("https://isaxl.mamboleoo.be/APIS/fetch_messages.php")
		.then(function (response) {
			console.log(response);
			response.json().then(function(data){
			console.log(data)
			updateChat(data.data)
		});
		})
		function updateChat (messages) {
			messages.forEach(function (message){
				console.log(message)
				console.log(message)
				let listItem = document.createElement("li");
				listItem.innerHTML =message.message+ "("+ message.time +")";
				let list = document.querySelector("ul");
				list.appendChild(listItem)
			


			})
		}
		document.querySelector("form").addEventListener("submit", function () {submitForm();
	})
		function submitForm()
		 {console.log("coucou");
		 let text = document.querySelector("input").value;
		 console.log(text);
		 fetch("https://isaxl.mamboleoo.be/APIS/post_message.php",{
		 	method: "POST",
		 	headers:{
		 		"Content-Type" : "application/x-www-form-urlencoded"
		 	},
		 	body: "cle=ABCD123&texte=" + text
		 });		 
		}
	</script>

</body>
	</html>
